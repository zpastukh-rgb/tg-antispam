<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#8fd41a" media="(prefers-color-scheme: light)" />
    <!-- Опционально: полный https:// URL API, если нельзя задать VITE_API_BASE_URL при сборке (редко). -->
    <meta name="guard-api-base" content="" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>AntiSpam Guard — Панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* До Vue/Tailwind: иначе при 404 на бандле — белый экран без текста */
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0b0b10;
        color: #e4e4e7;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        /* Убираем двойной тап и лишние жесты масштаба в WebView / мобильном браузере */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      #guard-boot-placeholder {
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        font-size: 14px;
        line-height: 1.45;
        max-width: 22rem;
      }
      #guard-boot-placeholder.guard-boot--err {
        color: #fca5a5;
        max-width: none;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="padding:16px;background:#0b0b10;color:#fecaca;font-family:system-ui,sans-serif;min-height:100vh"
      >
        Включите JavaScript — панель не работает без него.
      </div>
    </noscript>
    <div id="app">
      <div id="guard-boot-placeholder" role="status">Загрузка панели…</div>
    </div>
    <!-- Цель Vue Teleport для модалок: внутри shell рядом с #app (TMA / порядок отрисовки). -->
    <div id="guard-teleport-root"></div>
    <script src="/guard-api-config.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/guard-boot.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
